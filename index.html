<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-OS 窗口捕获器</title>
</head>
<body>
    <!-- 应用抽屉 -->
    <div id="app-drawer" class="drawer">
        <div class="drawer-header">
            <h2>已安装应用</h2>
            <button id="close-drawer" class="close-btn">×</button>
        </div>
        <div class="drawer-content">
            <div class="drawer-actions">
                <button id="refresh-apps-btn" class="refresh-btn">刷新应用</button>
            </div>
            <div id="apps-container" class="">
                <p>正在加载应用列表...</p>
            </div>
        </div>
    </div>
    
    <!-- 网页抽屉 -->
    <div id="web-drawer" class="drawer">
        <div class="drawer-header">
            <h2>打开网页</h2>
            <button id="close-web-drawer" class="close-btn">×</button>
        </div>
        <div class="drawer-content">
            <div class="web-input-section">
                <h3>输入网址</h3>
                <div class="url-input-container">
                    <input type="url" id="web-url-input" class="url-input" placeholder="输入网址，例如: https://example.com">
                    <button id="web-open-btn" class="open-web-btn">打开</button>
                </div>
            </div>
            
            <!-- 常用网站快捷方式 -->
            <div class="quick-links">
                <h3>常用网站</h3>
                <div class="quick-links-grid">
                    <a href="#" class="quick-link" data-url="https://www.google.com">Google</a>
                    <a href="#" class="quick-link" data-url="https://www.github.com">GitHub</a>
                    <a href="#" class="quick-link" data-url="https://www.stackoverflow.com">Stack Overflow</a>
                    <a href="#" class="quick-link" data-url="https://www.wikipedia.org">Wikipedia</a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 抽屉遮罩层 -->
    <div id="drawer-overlay" class="drawer-overlay"></div>
    
    <!-- 工具栏 -->
    <div id="toolbar" class="toolbar">
        <button id="text-tool" class="tool-btn active" title="文字工具 (T)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 7V4H20V7M9 20H15M12 4V20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>T</span>
        </button>
        <button id="rect-tool" class="tool-btn" title="矩形工具">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
        </button>
        <button id="select-tool" class="tool-btn" title="选择工具">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 3L10 7V6L21 17L20 18L9 7V8L3 3Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>
    
    <!-- 加号图标按钮 -->
    <button id="toggle-drawer" class="toggle-drawer-btn" title="打开应用">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>
    
    <!-- 网页加号图标按钮 -->
    <button id="toggle-web-drawer" class="toggle-drawer-btn web-drawer-btn" title="打开网页">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>
    
    <!-- 无限画布 -->
    <div id="infinite-canvas" class="infinite-canvas">
        <div id="canvas-viewport" class="canvas-viewport">
            <div id="canvas-content" class="canvas-content">
                <!-- 应用块将在这里动态生成 -->
            </div>
        </div>
    </div>
    
    <script type="module" src="/src/renderer.ts"></script>
</body>
</html>
